# Render Blueprint - jigou-neican read-only API
# Deploy: https://dashboard.render.com/blueprints/new?repo=tdxjigouneican/jigou-neican

services:
  - type: web
    name: jigou-neican-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 30 src.api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    autoDeploy: true
    branch: main
    healthCheckPath: /health
