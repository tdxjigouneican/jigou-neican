name: daily-jigou-neican

on:
  schedule:
    - cron: '0 12 * * *'  # UTC 12:00 = Asia/Shanghai 20:00
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch mode'
        required: true
        type: choice
        options:
          - today
          - backfill
        default: today
      start:
        description: 'backfill start (YYYY-MM-DD)'
        required: false
        type: string
        default: ''
      end:
        description: 'backfill end (YYYY-MM-DD)'
        required: false
        type: string
        default: ''

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch 机构内参 from 通达信
        env:
          TDX_API_BASE: 'http://hot.icfqs.com:7615'
          OUTPUT_DIR: 'data'
          FETCH_MODE: ${{ inputs.mode || 'today' }}
          FETCH_START: ${{ inputs.start || '' }}
          FETCH_END: ${{ inputs.end || '' }}
        run: |
          set -e
          mkdir -p $OUTPUT_DIR
          if [ "$FETCH_MODE" = "backfill" ]; then
            if [ -z "$FETCH_START" ] || [ -z "$FETCH_END" ]; then
              echo "ERR: backfill needs --start and --end"; exit 1
            fi
            python src/jigou_fetcher.py backfill --start "$FETCH_START" --end "$FETCH_END" --output $OUTPUT_DIR
          else
            python src/jigou_fetcher.py today --output $OUTPUT_DIR
          fi
          echo "[fetch] done. Files in $OUTPUT_DIR:"
          find $OUTPUT_DIR -type f | head -10

      - name: AI summarize with agnes (for IMA only)
        if: env.FETCH_MODE != 'backfill' || inputs.mode != 'backfill'
        continue-on-error: true
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: 'https://apihub.agnes-ai.com/v1'
        run: |
          echo "[agnes] AGNES_API_KEY length: ${#AGNES_API_KEY}, AGNES_BASE_URL=$AGNES_BASE_URL"
          if [ -z "$AGNES_API_KEY" ]; then
            echo "WARN: AGNES_API_KEY not set, skip summarize"; exit 0
          fi
          if [ ! -d data ] || [ -z "$(find data -name '*.md' -type f | head -1)" ]; then
            echo "WARN: no .md files in data/, skip summarize"; exit 0
          fi
          python src/agnes_summarize.py --input data --output data/summarized.json --limit 50 || echo "WARN: agnes failed"
          echo "[agnes] done. summarized.json size: $(wc -c < data/summarized.json 2>/dev/null || echo 0) bytes"

      - name: Push to 知识星球《外资纪要社》(原文)
        if: env.FETCH_MODE != 'backfill' || inputs.mode != 'backfill'
        env:
          ZSXQ_GROUP_ID: ${{ secrets.ZSXQ_GROUP_ID }}
          ZSXQ_OAUTH_TOKEN: ${{ secrets.ZSXQ_OAUTH_TOKEN }}
        run: |
          set -e
          if [ -z "$ZSXQ_OAUTH_TOKEN" ]; then
            echo "ERR: ZSXQ_OAUTH_TOKEN not set"; exit 1
          fi
          echo "[zsxq] GROUP_ID=$ZSXQ_GROUP_ID, TOKEN_LEN=${#ZSXQ_OAUTH_TOKEN}"
          # 直接推 .md 原文(不经过 summarized.json 的 ai_summary)
          python src/push_zsxq.py --input data || echo "[zsxq] push had errors, continue"

      - name: Push to IMA 知识库
        if: env.FETCH_MODE != 'backfill' || inputs.mode != 'backfill'
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          IMA_KB_ID: 'eD_gxNj7vxloDEYzjG9_9LEdABb_WBeI5Tqjs41lm_I='
          IMA_FOLDER_ID: 'folder_7506378096640223'
        run: |
          set -e
          # IMA 入库优先用 AI 摘要(summarized.json), 缺失时回退到 .md 原文
          if [ -f data/summarized.json ]; then
            python src/push_ima.py --input data/summarized.json
          else
            echo "WARN: summarized.json not found, fallback to .md files"
            python src/push_ima.py --input data
          fi

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: auto-fetch 机构内参 $(date +%Y-%m-%d)" || exit 0
          git push

      - name: Notify on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          MSG="jigou-neican workflow failed: ${{ github.workflow }} @ ${{ github.run_id }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$FEISHU_WEBHOOK" ]; then
            curl -fsS -X POST "$FEISHU_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}" || echo "feishu notify failed"
          fi
          if [ -n "$DINGTALK_WEBHOOK" ]; then
            curl -fsS -X POST "$DINGTALK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"$MSG\"}}" || echo "dingtalk notify failed"
          fi
          if [ -z "$FEISHU_WEBHOOK" ] && [ -z "$DINGTALK_WEBHOOK" ]; then
            echo "No webhook configured; skip notify"
          fi